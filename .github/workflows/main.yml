name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 降低 JDK 版本到 11，避免老项目 Gradle 脚本解析失败
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 安装兼容性更好的 NDK 21/23 以及 CMake
      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 增加 --stacktrace 和 --full-stacktrace 以便定位深层错误
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FaceSwap-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
