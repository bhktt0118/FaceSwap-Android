name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. 必须优先配置 JDK 17（满足最新 sdkmanager 的硬性要求）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 2. 环境变量：开启兼容标记，防止 SDK 工具校验报错
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: "true"

      # 3. 安装项目所需的 NDK 与 CMake
      - name: Install NDK & CMake
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. 执行编译
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 5. 上传生成的 APK 产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FaceSwap-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
concurrency: 
